name: waraqah
description: "Waraqah - a Flutter book marketplace, P2P resale, social reading feed and AI assistant."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^17.2.1

  # State management
  flutter_riverpod: ^3.0.3

  # Networking
  dio: ^5.9.0
  # Reads live (server-sent events) answers while they arrive on the web.
  web: ^1.1.1

  # Models / codegen runtime
  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0

  # UI
  shimmer: ^3.0.0
  google_fonts: ^6.3.3
  cupertino_icons: ^1.0.8

  # Storage / cache / i18n
  shared_preferences: ^2.5.3
  intl: any
  # Counts Bite text in graphemes, so a Bangla conjunct is one character.
  characters: any

  # Device
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  shared_preferences_platform_interface: ^2.4.2
  build_runner: ^2.7.1
  freezed: ^4.0.2
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  generate: true
